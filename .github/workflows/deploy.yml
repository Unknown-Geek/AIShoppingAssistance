name: Deploy Server (Hugging Face & Oracle VM)

on:
  push:
    branches: [ main ]
    paths:
      - 'hf_server/**'

jobs:
  deploy_backup_hf:
    name: Sync to Hugging Face Space (Backup Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Retry loop with backoff to handle transient rate limit or network errors
          for i in {1..5}; do
            echo "Upload attempt $i/5..."
            if python -c "import os; from huggingface_hub import HfApi; api = HfApi(token=os.environ['HF_TOKEN']); api.upload_folder(folder_path='./hf_server', repo_id='Mojo-Maniac/AIShoppingAssistance_Server', repo_type='space', delete_patterns='*')"
            then
              echo "Upload successful!"
              exit 0
            else
              if [ $i -eq 5 ]; then
                echo "Failed to upload to Hugging Face Space after 5 attempts."
                exit 1
              fi
              delay=$((i * 15))
              echo "Upload failed. Retrying in $delay seconds..."
              sleep $delay
            fi
          done

  deploy_primary_oracle:
    name: Deploy to Oracle VM (Primary Server)
    needs: deploy_backup_hf
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd ${{ secrets.ORACLE_VM_REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main
            chmod +x run_local.sh
            ./run_local.sh
